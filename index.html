<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>樂羽會館｜羽球零打報名系統</title>


<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<style>

/* =========================================================
   基本
   ========================================================= */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background: #f3f4f6;

  color: #222;

  font-family:
    Arial,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

}


/* =========================================================
   標題
   ========================================================= */

.header {

  background: #111;

  color: white;

  text-align: center;

  padding: 24px 15px;

}


.header h1 {

  margin: 0;

  font-size: 28px;

}


.header p {

  margin: 7px 0 0;

  color: #ccc;

}


/* =========================================================
   主要內容
   ========================================================= */

.container {

  width:
    min(
      1100px,
      calc(100% - 24px)
    );

  margin:
    15px auto 50px;

}


/* =========================================================
   LINE 使用者
   ========================================================= */

.user-box {

  background: white;

  border-radius: 15px;

  padding: 18px;

  display: flex;

  align-items: center;

  gap: 15px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.06);

  margin-bottom: 20px;

}


.line-icon {

  width: 48px;

  height: 48px;

  min-width: 48px;

  border-radius: 50%;

  background: #06c755;

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  font-weight: bold;

}


.user-title {

  color: #777;

  font-size: 14px;

}


.user-name {

  font-size: 18px;

  font-weight: bold;

  margin-top: 3px;

}


/* =========================================================
   載入
   ========================================================= */

.loading {

  background: white;

  padding: 30px;

  border-radius: 15px;

  text-align: center;

  margin-bottom: 15px;

}


/* =========================================================
   錯誤
   ========================================================= */

.error-box {

  background: #fff0f0;

  color: #d32f2f;

  padding: 18px;

  border-radius: 12px;

  margin-bottom: 20px;

  white-space: pre-line;

}


/* =========================================================
   日期
   ========================================================= */

.day-title {

  font-size: 21px;

  font-weight: bold;

  border-left:
    5px solid #111;

  padding-left: 10px;

  margin:
    20px 0 10px;

}


/* =========================================================
   場次卡片
   ========================================================= */

.session-card {

  background: white;

  border-radius: 15px;

  padding: 18px;

  margin-bottom: 10px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 20px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.05);

}


.session-info {

  min-width: 0;

}


.session-info h3 {

  margin:
    0 0 8px;

  font-size: 18px;

}


.session-time {

  color: #555;

  margin-bottom: 7px;

}


.session-count {

  color: #00a95c;

  font-size: 15px;

}


.session-full {

  color: #e53935;

  font-weight: bold;

}


/* =========================================================
   按鈕
   ========================================================= */

.btn {

  border: 0;

  border-radius: 10px;

  padding:
    12px 20px;

  background: #111;

  color: white;

  font-size: 16px;

  cursor: pointer;

  white-space: nowrap;

}


.btn:hover {

  opacity: .9;

}


.btn:disabled {

  background: #aaa;

  cursor: not-allowed;

}


.btn-full {

  background: #aaa;

}


/* =========================================================
   Modal
   ========================================================= */

.modal-mask {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.58);

  display: none;

  align-items: center;

  justify-content: center;

  z-index: 9999;

  padding: 15px;

}


.modal {

  background: white;

  width:
    min(
      520px,
      100%
    );

  border-radius: 18px;

  padding: 24px;

  max-height: 92vh;

  overflow-y: auto;

}


.modal h2 {

  margin-top: 0;

  margin-bottom: 18px;

}


.info-line {

  margin: 8px 0;

  color: #555;

}


.info-line strong {

  color: #222;

}


/* =========================================================
   表單
   ========================================================= */

.form-label {

  display: block;

  font-weight: bold;

  margin:
    20px 0 7px;

}


.input {

  width: 100%;

  padding: 13px;

  border:
    1px solid #ccc;

  border-radius: 10px;

  font-size: 17px;

  outline: none;

}


.input:focus {

  border-color: #111;

}


/* =========================================================
   Modal 按鈕
   ========================================================= */

.modal-buttons {

  display: flex;

  gap: 10px;

  margin-top: 22px;

}


.btn-cancel {

  flex: 1;

  background: #eee;

  color: #333;

}


.btn-submit {

  flex: 1;

  background: #06c755;

}


.btn-submit:disabled {

  background: #aaa;

}


/* =========================================================
   Modal 訊息
   ========================================================= */

.message {

  padding: 16px;

  border-radius: 10px;

  margin-top: 18px;

  white-space: pre-line;

  line-height: 1.7;

}


.message.success {

  background: #e9f9ef;

  color: #008c4a;

}


.message.error {

  background: #fff0f0;

  color: #d32f2f;

}


.message.processing {

  background: #f3f4f6;

  color: #555;

}


.success-title {

  font-size: 20px;

  font-weight: bold;

  margin-bottom: 12px;

}


/* =========================================================
   成功後按鈕
   ========================================================= */

.success-close {

  width: 100%;

  margin-top: 15px;

  background: #111;

}


/* =========================================================
   手機版
   ========================================================= */

@media (max-width: 600px) {

  .header h1 {

    font-size: 24px;

  }


  .container {

    width:
      calc(100% - 18px);

  }


  .session-card {

    padding: 15px;

    align-items: center;

  }


  .session-info h3 {

    font-size: 17px;

  }


  .session-time {

    font-size: 15px;

  }


  .session-count {

    font-size: 14px;

  }


  .btn {

    padding:
      10px 14px;

    font-size: 15px;

  }


  .modal {

    padding: 20px;

  }


  .modal-buttons {

    flex-direction: column;

  }


  .btn-cancel,
  .btn-submit {

    width: 100%;

  }

}

</style>

</head>


<body>


<!-- =======================================================
     標題
     ======================================================= -->

<div class="header">

  <h1>樂羽會館</h1>

  <p>羽球零打報名系統</p>

</div>


<!-- =======================================================
     主要內容
     ======================================================= -->

<div class="container">


  <!-- LINE 使用者 -->

  <div class="user-box">

    <div class="line-icon">
      LINE
    </div>

    <div>

      <div class="user-title">
        LINE 使用者
      </div>

      <div
        class="user-name"
        id="userName"
      >
        登入中...
      </div>

    </div>

  </div>


  <!-- 錯誤 -->

  <div id="errorArea"></div>


  <!-- 載入 -->

  <div
    id="loading"
    class="loading"
  >
    場次載入中...
  </div>


  <!-- 場次 -->

  <div id="sessionArea"></div>


</div>


<!-- =======================================================
     報名 Modal
     ======================================================= -->

<div
  id="modalMask"
  class="modal-mask"
>

  <div class="modal">


    <h2>
      零打報名
    </h2>


    <div class="info-line">

      日期：

      <strong
        id="modalDate"
      ></strong>

    </div>


    <div class="info-line">

      梯次：

      <strong
        id="modalSession"
      ></strong>

    </div>


    <div class="info-line">

      時間：

      <strong
        id="modalTime"
      ></strong>

    </div>


    <div class="info-line">

      剩餘名額：

      <strong
        id="modalRemaining"
      ></strong>

    </div>


    <label
      class="form-label"
      for="nameInput"
    >
      姓名
    </label>


    <input
      id="nameInput"
      class="input"
      type="text"
      placeholder="請輸入姓名"
      autocomplete="name"
    >


    <label
      class="form-label"
      for="phoneInput"
    >
      手機號碼
    </label>


    <input
      id="phoneInput"
      class="input"
      type="tel"
      placeholder="例如：0912345678"
      maxlength="10"
      inputmode="numeric"
      autocomplete="tel"
    >


    <div
      id="modalMessage"
    ></div>


    <div class="modal-buttons">


      <button
        id="cancelButton"
        class="btn btn-cancel"
        type="button"
        onclick="關閉視窗()"
      >
        取消
      </button>


      <button
        id="submitButton"
        class="btn btn-submit"
        type="button"
        onclick="送出報名()"
      >
        確認報名
      </button>


    </div>


  </div>

</div>


<script>

/* =========================================================
   系統設定
   ========================================================= */


/*
 * LINE LIFF ID
 */

const LIFF_ID =
  "2011603755-U8bYBa4n";


/*
 * Google Apps Script Web App
 */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyFxTErNwhLKgIhDuuZwILEyC39oXwAEdzuPhl1uLvWsACZ5DzAlZIU5pCEjxxf8rAnyg/exec";


/*
 * GitHub Pages 網域
 */

const SITE_ORIGIN =
  "https://okbunokbun.github.io";


/* =========================================================
   全域變數
   ========================================================= */

let currentUser = null;

let currentSession = null;

let lineIdToken = null;

let isSubmitting = false;


/* =========================================================
   初始化
   ========================================================= */

async function 初始化() {

  try {


    /*
     * 初始化 LIFF
     */

    await liff.init({

      liffId:
        LIFF_ID

    });


    /*
     * 如果尚未登入
     */

    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    /*
     * 取得 LINE Profile
     */

    currentUser =
      await liff.getProfile();


    document.getElementById(
      "userName"
    ).textContent =

      currentUser.displayName ||
      "LINE 使用者";


    /*
     * 取得原始 ID Token
     *
     * 只傳給後端驗證
     */

    lineIdToken =
      liff.getIDToken();


    if (!lineIdToken) {

      throw new Error(

        "無法取得 LINE ID Token。\n\n" +

        "請關閉目前頁面，" +

        "再從 LINE 官方帳號重新開啟「零打報名」。"

      );

    }


    /*
     * 載入場次
     */

    await 載入場次();


  } catch (error) {

    console.error(
      "LIFF 初始化錯誤",
      error
    );


    顯示錯誤(

      error &&
      error.message

        ? error.message

        : "LINE LIFF 初始化失敗"

    );

  }

}


/* =========================================================
   載入場次
   ========================================================= */

function 載入場次() {

  return new Promise(

    function(resolve, reject) {


      const callbackName =

        "liffSessions_" +

        Date.now() +

        "_" +

        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished = false;


      const timeout =

        setTimeout(

          function() {

            if (finished) {
              return;
            }


            finished = true;

            cleanup();


            reject(

              new Error(
                "場次資料載入逾時"
              )

            );

          },

          15000

        );


      window[callbackName] =

        function(data) {


          if (finished) {
            return;
          }


          finished = true;

          cleanup();


          if (

            !data ||

            data.success !== true

          ) {

            reject(

              new Error(

                data &&
                data.message

                  ? data.message

                  : "無法取得場次資料"

              )

            );

            return;

          }


          try {

            顯示場次(
              data.sessions || []
            );


            resolve(data);


          } catch (error) {

            reject(error);

          }

        };


      script.src =

        API_URL +

        "?action=sessions" +

        "&callback=" +

        encodeURIComponent(
          callbackName
        ) +

        "&_=" +

        Date.now();


      script.onerror =

        function() {


          if (finished) {
            return;
          }


          finished = true;

          cleanup();


          reject(

            new Error(
              "無法連線到報名系統"
            )

          );

        };


      document.body.appendChild(
        script
      );


      function cleanup() {

        clearTimeout(timeout);


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (e) {}

      }

    }

  );

}


/* =========================================================
   顯示場次
   ========================================================= */

function 顯示場次(
  sessions
) {


  document.getElementById(
    "loading"
  ).style.display =
    "none";


  const area =
    document.getElementById(
      "sessionArea"
    );


  area.innerHTML = "";


  if (

    !sessions ||

    sessions.length === 0

  ) {

    area.innerHTML =

      '<div class="loading">' +

      "目前沒有可報名場次" +

      "</div>";

    return;

  }


  let currentDate = "";


  sessions.forEach(

    function(session) {


      /*
       * 新日期
       */

      if (

        session.date !==
        currentDate

      ) {


        currentDate =
          session.date;


        const dayTitle =
          document.createElement(
            "div"
          );


        dayTitle.className =
          "day-title";


        dayTitle.textContent =
          顯示日期(
            currentDate
          );


        area.appendChild(
          dayTitle
        );

      }


      /*
       * 場次卡
       */

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "session-card";


      /*
       * 左側資訊
       */

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "session-info";


      /*
       * 梯次
       */

      const title =
        document.createElement(
          "h3"
        );


      title.textContent =

        "第 " +

        session.sessionId +

        " 梯";


      /*
       * 時間
       */

      const time =
        document.createElement(
          "div"
        );


      time.className =
        "session-time";


      time.textContent =

        session.startTime +

        " – " +

        session.endTime;


      /*
       * 人數
       */

      const count =
        document.createElement(
          "div"
        );


      count.className =
        "session-count";


      const remaining =
        Number(
          session.remaining
        ) || 0;


      const booked =
        Number(
          session.booked
        ) || 0;


      if (
        remaining <= 0
      ) {


        count.classList.add(
          "session-full"
        );


        count.textContent =
          "已額滿";


      } else {


        count.textContent =

          "已報名 " +

          booked +

          " 人｜剩餘 " +

          remaining +

          " 人";

      }


      info.appendChild(
        title
      );


      info.appendChild(
        time
      );


      info.appendChild(
        count
      );


      /*
       * 報名按鈕
       */

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "btn";


      button.type =
        "button";


      if (
        remaining <= 0
      ) {


        button.textContent =
          "已額滿";


        button.disabled =
          true;


        button.classList.add(
          "btn-full"
        );


      } else {


        button.textContent =
          "立即報名";


        button.disabled =
          false;


        button.onclick =

          function() {

            開啟報名視窗(
              session
            );

          };

      }


      card.appendChild(
        info
      );


      card.appendChild(
        button
      );


      area.appendChild(
        card
      );

    }

  );

}


/* =========================================================
   顯示日期
   ========================================================= */

function 顯示日期(
  dateString
) {


  const parts =
    String(
      dateString || ""
    ).split("-");


  if (
    parts.length !== 3
  ) {

    return dateString;

  }


  const year =
    Number(parts[0]);


  const month =
    Number(parts[1]);


  const day =
    Number(parts[2]);


  const date =
    new Date(
      year,
      month - 1,
      day
    );


  const week =

    [

      "日",
      "一",
      "二",
      "三",
      "四",
      "五",
      "六"

    ][
      date.getDay()
    ];


  return (

    parts[1] +

    "/" +

    parts[2] +

    " 星期" +

    week

  );

}


/* =========================================================
   開啟報名視窗
   ========================================================= */

function 開啟報名視窗(
  session
) {


  if (!session) {

    return;

  }


  currentSession =
    session;


  /*
   * 日期
   */

  document.getElementById(
    "modalDate"
  ).textContent =

    String(
      session.date || ""
    )
      .substring(5)
      .replace(
        "-",
        "/"
      );


  /*
   * 梯次
   */

  document.getElementById(
    "modalSession"
  ).textContent =

    "第 " +

    session.sessionId +

    " 梯";


  /*
   * 時間
   */

  document.getElementById(
    "modalTime"
  ).textContent =

    session.startTime +

    " – " +

    session.endTime;


  /*
   * 剩餘
   */

  document.getElementById(
    "modalRemaining"
  ).textContent =

    Number(
      session.remaining
    ) +

    " 人";


  /*
   * 清除訊息
   */

  document.getElementById(
    "modalMessage"
  ).innerHTML = "";


  document.getElementById(
    "modalMessage"
  ).className = "";


  /*
   * 重設按鈕
   */

  const submitButton =
    document.getElementById(
      "submitButton"
    );


  const cancelButton =
    document.getElementById(
      "cancelButton"
    );


  submitButton.disabled =
    false;


  submitButton.textContent =
    "確認報名";


  cancelButton.disabled =
    false;


  /*
   * 清空姓名、電話
   */

  document.getElementById(
    "nameInput"
  ).value = "";


  document.getElementById(
    "phoneInput"
  ).value = "";


  /*
   * 顯示
   */

  document.getElementById(
    "modalMask"
  ).style.display =
    "flex";


  /*
   * Focus
   */

  setTimeout(

    function() {

      document.getElementById(
        "nameInput"
      ).focus();

    },

    100

  );

}


/* =========================================================
   關閉視窗
   ========================================================= */

function 關閉視窗() {


  if (isSubmitting) {

    return;

  }


  document.getElementById(
    "modalMask"
  ).style.display =
    "none";


  document.getElementById(
    "modalMessage"
  ).innerHTML = "";


  document.getElementById(
    "modalMessage"
  ).className = "";


  currentSession =
    null;

}


/* =========================================================
   送出報名
   ========================================================= */

async function 送出報名() {


  /*
   * 防止重複點擊
   */

  if (isSubmitting) {

    return;

  }


  /*
   * 檢查場次
   */

  if (!currentSession) {

    顯示Modal錯誤(

      "場次資料不存在，請重新整理頁面。"

    );

    return;

  }


  /*
   * 姓名
   */

  const name =

    document.getElementById(
      "nameInput"
    ).value.trim();


  /*
   * 電話
   */

  let phone =

    document.getElementById(
      "phoneInput"
    ).value.trim();


  /*
   * 去除空白
   */

  phone =
    phone.replace(
      /\s+/g,
      ""
    );


  /*
   * 9xxxxxxxx
   *
   * 自動補 0
   */

  if (
    /^9\d{8}$/.test(phone)
  ) {

    phone =
      "0" + phone;

  }


  /*
   * 姓名驗證
   */

  if (!name) {

    顯示Modal錯誤(
      "請輸入姓名"
    );

    return;

  }


  /*
   * 電話驗證
   */

  if (
    !/^09\d{8}$/.test(phone)
  ) {

    顯示Modal錯誤(

      "手機號碼格式錯誤，請輸入 10 碼手機號碼"

    );

    return;

  }


  /*
   * 檢查剩餘
   */

  if (
    Number(
      currentSession.remaining
    ) <= 0
  ) {

    顯示Modal錯誤(
      "此梯次已額滿，請重新整理頁面。"
    );

    return;

  }


  /*
   * 重新取得最新 ID Token
   */

  try {

    lineIdToken =
      liff.getIDToken();

  } catch (error) {

    console.error(
      "取得 LINE ID Token 失敗",
      error
    );


    顯示Modal錯誤(

      "無法取得 LINE 身分驗證資料。\n\n" +

      "請關閉頁面後，重新從 LINE 官方帳號開啟零打報名。"

    );

    return;

  }


  if (!lineIdToken) {

    顯示Modal錯誤(

      "LINE ID Token 不存在。\n\n" +

      "請重新開啟零打報名頁面。"

    );

    return;

  }


  /*
   * 建立唯一 request_id
   */

  const requestId =

    Date.now().toString(36) +

    "_" +

    Math.random()
      .toString(36)
      .substring(
        2,
        10
      );


  /*
   * 鎖定畫面
   */

  isSubmitting =
    true;


  const submitButton =
    document.getElementById(
      "submitButton"
    );


  const cancelButton =
    document.getElementById(
      "cancelButton"
    );


  submitButton.disabled =
    true;


  cancelButton.disabled =
    true;


  submitButton.textContent =
    "報名處理中...";


  顯示Modal處理中(

    "正在確認報名資料...\n\n" +

    "請稍候，請勿重複點擊。"

  );


  try {


    /*
     * ================================================
     * 第一步：
     *
     * POST 到 Apps Script
     *
     * 這裡會真正等待 iframe 載入完成
     * ================================================
     */

    const postResult =

      await 送出POST表單({

        request_id:
          requestId,

        date:
          currentSession.date,

        session_id:
          currentSession.sessionId,

        name:
          name,

        phone:
          phone,

        id_token:
          lineIdToken

      });


    /*
     * 如果 POST 本身直接回傳成功
     */

    if (

      postResult &&

      postResult.success === true

    ) {

      顯示報名成功(
        postResult
      );

      return;

    }


    /*
     * 如果 POST 回傳失敗
     */

    if (

      postResult &&

      postResult.success === false &&

      postResult.status === "failed"

    ) {

      /*
       * 有可能是 Apps Script
       * 已經處理完成的失敗結果
       */

      throw new Error(

        postResult.message ||

        "報名失敗"

      );

    }


    /*
     * ================================================
     * 第二步：
     *
     * POST 完成後查詢 bookingStatus
     * ================================================
     */

    const finalResult =

      await 等待報名結果(

        requestId

      );


    if (

      finalResult &&

      finalResult.success === true

    ) {

      顯示報名成功(
        finalResult
      );

      return;

    }


    throw new Error(

      finalResult &&
      finalResult.message

        ? finalResult.message

        : "無法取得報名結果"

    );


  } catch (error) {


    console.error(
      "報名流程錯誤",
      error
    );


    顯示Modal錯誤(

      error &&
      error.message

        ? error.message

        : "報名失敗，請稍後再試"

    );


    isSubmitting =
      false;


    submitButton.disabled =
      false;


    cancelButton.disabled =
      false;


    submitButton.textContent =
      "重新報名";

  }

}


/* =========================================================
   POST 表單
   =========================================================
   
   ★ 這裡是本次最重要的修正
   ★ 不再 800ms 就刪掉 iframe
   ★ 等 iframe onload
   ========================================================= */

function 送出POST表單(
  data
) {

  return new Promise(

    function(resolve, reject) {


      const iframeName =

        "booking_iframe_" +

        Date.now() +

        "_" +

        Math.floor(
          Math.random() * 100000
        );


      /*
       * 建立 iframe
       */

      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.name =
        iframeName;


      iframe.id =
        iframeName;


      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      /*
       * 建立 form
       */

      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        API_URL;


      form.target =
        iframeName;


      form.style.display =
        "none";


      /*
       * 填入 POST 欄位
       */

      Object.keys(data)
        .forEach(

          function(key) {


            const input =
              document.createElement(
                "input"
              );


            input.type =
              "hidden";


            input.name =
              key;


            input.value =
              String(
                data[key] || ""
              );


            form.appendChild(
              input
            );

          }

        );


      document.body.appendChild(
        form
      );


      /*
       * 完成旗標
       */

      let finished =
        false;


      /*
       * 最長等待 45 秒
       */

      const timeout =

        setTimeout(

          function() {


            if (finished) {
              return;
            }


            finished =
              true;


            cleanup();


            /*
             * 不直接判定失敗
             *
             * 因為 Apps Script
             * 可能已經寫入資料。
             *
             * 交給 bookingStatus
             * 繼續確認。
             */

            resolve({

              success: false,

              status:
                "processing"

            });


          },

          45000

        );


      /*
       * iframe 完成載入
       */

      iframe.onload =

        function() {


          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          /*
           * 因為跨網域，
           * 無法直接讀 iframe 內容。
           *
           * 所以只代表：
           *
           * POST request 已經完成。
           */

          resolve({

            success: false,

            status:
              "processing"

          });

        };


      /*
       * iframe error
       */

      iframe.onerror =

        function() {


          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          /*
           * 即使 iframe error，
           * 報名可能已經送到後端。
           *
           * 因此仍然讓 bookingStatus
           * 繼續查詢。
           */

          resolve({

            success: false,

            status:
              "processing"

          });

        };


      /*
       * 送出
       */

      try {

        form.submit();

      } catch (error) {

        if (!finished) {

          finished =
            true;

          cleanup();

          reject(error);

        }

      }


      /*
       * 清除
       */

      function cleanup() {


        clearTimeout(
          timeout
        );


        /*
         * 延遲一點再刪除 iframe
         *
         * 避免瀏覽器仍在處理
         */

        setTimeout(

          function() {


            try {

              if (
                form.parentNode
              ) {

                form.parentNode.removeChild(
                  form
                );

              }

            } catch (e) {}


            try {

              if (
                iframe.parentNode
              ) {

                iframe.parentNode.removeChild(
                  iframe
                );

              }

            } catch (e) {}

          },

          1000

        );

      }

    }

  );

}


/* =========================================================
   等待報名結果
   ========================================================= */

async function 等待報名結果(
  requestId
) {


  /*
   * 最多約 30 秒
   *
   * 0
   * 1
   * 2
   * 3
   * ...
   */

  const maxAttempts =
    30;


  for (
    let i = 0;
    i < maxAttempts;
    i++
  ) {


    /*
     * 第一次稍微等一下
     */

    await 等待(
      i === 0
        ? 500
        : 1000
    );


    try {


      const result =

        await 查詢報名狀態(
          requestId
        );


      /*
       * 成功
       */

      if (

        result &&

        result.success === true &&

        result.status ===
          "success"

      ) {

        return result;

      }


      /*
       * 失敗
       */

      if (

        result &&

        result.success === false &&

        result.status ===
          "failed"

      ) {

        return result;

      }


      /*
       * processing
       *
       * 繼續查
       */

    } catch (error) {


      console.warn(

        "第 " +

        (i + 1) +

        " 次查詢報名狀態失敗",

        error

      );


      /*
       * 不立即判定失敗
       *
       * 繼續重試
       */

    }

  }


  /*
   * 最後再查一次
   */

  try {

    const finalCheck =

      await 查詢報名狀態(
        requestId
      );


    if (
      finalCheck
    ) {

      return finalCheck;

    }

  } catch (error) {

    console.error(
      "最後一次查詢失敗",
      error
    );

  }


  throw new Error(

    "報名處理時間過長。\n\n" +

    "請稍候重新整理頁面確認報名結果。"

  );

}


/* =========================================================
   查詢 bookingStatus
   ========================================================= */

function 查詢報名狀態(
  requestId
) {

  return new Promise(

    function(resolve, reject) {


      if (!requestId) {

        reject(

          new Error(
            "缺少 request_id"
          )

        );

        return;

      }


      const callbackName =

        "bookingStatus_" +

        Date.now() +

        "_" +

        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      /*
       * 8 秒 timeout
       */

      const timeout =

        setTimeout(

          function() {


            if (finished) {
              return;
            }


            finished =
              true;


            cleanup();


            reject(

              new Error(
                "報名狀態查詢逾時"
              )

            );

          },

          8000

        );


      /*
       * JSONP callback
       */

      window[callbackName] =

        function(data) {


          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          resolve(
            data
          );

        };


      /*
       * URL
       */

      script.src =

        API_URL +

        "?action=bookingStatus" +

        "&request_id=" +

        encodeURIComponent(
          requestId
        ) +

        "&callback=" +

        encodeURIComponent(
          callbackName
        ) +

        "&_=" +

        Date.now();


      /*
       * script error
       */

      script.onerror =

        function() {


          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(

            new Error(
              "無法查詢報名結果"
            )

          );

        };


      document.body.appendChild(
        script
      );


      /*
       * 清除
       */

      function cleanup() {


        clearTimeout(
          timeout
        );


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (e) {}

      }

    }

  );

}


/* =========================================================
   報名成功
   ========================================================= */

function 顯示報名成功(
  result
) {


  isSubmitting =
    false;


  const message =
    document.getElementById(
      "modalMessage"
    );


  message.className =
    "message success";


  const date =
    result.date || "";


  const sessionId =
    result.sessionId || "";


  const startTime =
    result.startTime || "";


  const endTime =
    result.endTime || "";


  const bookingId =
    result.bookingId || "";


  const remaining =
    result.remaining;


  /*
   * 使用 DOM，不直接信任 HTML 字串
   */

  message.innerHTML = "";


  const title =
    document.createElement(
      "div"
    );


  title.className =
    "success-title";


  title.textContent =
    "🎉 報名成功！";


  message.appendChild(
    title
  );


  const info =
    document.createElement(
      "div"
    );


  info.textContent =

    "日期：" +

    格式化顯示日期(date) +

    "\n第 " +

    sessionId +

    " 梯" +

    "\n時間：" +

    startTime +

    " – " +

    endTime;


  if (
    bookingId
  ) {

    info.textContent +=

      "\n報名編號：" +

      bookingId;

  }


  if (
    remaining !== null &&
    remaining !== undefined &&
    remaining !== ""
  ) {

    info.textContent +=

      "\n剩餘名額：" +

      remaining +

      " 人";

  }


  info.textContent +=

    "\n\n請準時到場。";


  message.appendChild(
    info
  );


  /*
   * 按鈕
   */

  const submitButton =
    document.getElementById(
      "submitButton"
    );


  const cancelButton =
    document.getElementById(
      "cancelButton"
    );


  submitButton.disabled =
    true;


  submitButton.textContent =
    "報名成功";


  cancelButton.disabled =
    false;


  cancelButton.textContent =
    "關閉";


  cancelButton.onclick =
    function() {

      isSubmitting =
        false;

      關閉視窗();

    };


  /*
   * 重新載入場次
   *
   * 讓人數立即更新
   */

  setTimeout(

    async function() {


      try {

        await 載入場次();

      } catch (error) {

        console.warn(
          "重新載入場次失敗",
          error
        );

      }

    },

    500

  );

}


/* =========================================================
   Modal 錯誤
   ========================================================= */

function 顯示Modal錯誤(
  message
) {


  const box =
    document.getElementById(
      "modalMessage"
    );


  box.className =
    "message error";


  box.textContent =

    "❌ " +

    String(
      message ||
      "報名失敗"
    );

}


/* =========================================================
   Modal 處理中
   ========================================================= */

function 顯示Modal處理中(
  message
) {


  const box =
    document.getElementById(
      "modalMessage"
    );


  box.className =
    "message processing";


  box.textContent =

    String(
      message ||
      "正在處理..."
    );

}


/* =========================================================
   頁面錯誤
   ========================================================= */

function 顯示錯誤(
  message
) {


  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "errorArea"
  ).innerHTML = "";


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "error-box";


  box.textContent =

    String(
      message ||
      "系統發生錯誤"
    );


  document.getElementById(
    "errorArea"
  ).appendChild(
    box
  );

}


/* =========================================================
   日期顯示
   ========================================================= */

function 格式化顯示日期(
  dateString
) {


  const text =
    String(
      dateString || ""
    );


  if (!text) {

    return "";

  }


  if (
    /^\d{4}-\d{2}-\d{2}$/.test(
      text
    )
  ) {

    return (

      text.substring(5, 7) +

      "/" +

      text.substring(8, 10)

    );

  }


  return text;

}


/* =========================================================
   等待
   ========================================================= */

function 等待(
  ms
) {

  return new Promise(

    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }

  );

}


/* =========================================================
   啟動
   ========================================================= */

window.addEventListener(

  "load",

  function() {

    初始化();

  }

);

</script>
