<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  樂羽會館｜羽球零打報名系統
</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background: #f3f4f6;

  color: #222;

  font-family:
    Arial,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

}


.header {

  background: #111;

  color: white;

  text-align: center;

  padding: 22px 15px;

}


.header h1 {

  margin: 0;

  font-size: 28px;

}


.header p {

  margin: 7px 0 0;

  color: #ccc;

}


.container {

  width:
    min(
      1100px,
      calc(100% - 24px)
    );

  margin:
    15px auto 50px;

}


.user-box {

  background: white;

  border-radius: 15px;

  padding: 18px;

  display: flex;

  align-items: center;

  gap: 15px;

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.06);

  margin-bottom: 20px;

}


.line-icon {

  width: 48px;

  height: 48px;

  border-radius: 50%;

  background: #06c755;

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  font-weight: bold;

}


.user-title {

  color: #777;

  font-size: 14px;

}


.user-name {

  font-size: 18px;

  font-weight: bold;

  margin-top: 3px;

}


.loading {

  background: white;

  padding: 30px;

  border-radius: 15px;

  text-align: center;

}


.error-box {

  background: #fff0f0;

  color: #e53935;

  padding: 18px;

  border-radius: 12px;

  margin-bottom: 20px;

}


.day-title {

  font-size: 21px;

  font-weight: bold;

  border-left: 5px solid #111;

  padding-left: 10px;

  margin: 20px 0 10px;

}


.session-card {

  background: white;

  border-radius: 15px;

  padding: 18px;

  margin-bottom: 10px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.05);

}


.session-info h3 {

  margin: 0 0 8px;

  font-size: 18px;

}


.session-time {

  color: #555;

  margin-bottom: 7px;

}


.session-count {

  color: #00a95c;

  font-size: 15px;

}


.session-full {

  color: #e53935;

}


.btn {

  border: 0;

  border-radius: 10px;

  padding: 12px 20px;

  background: #111;

  color: white;

  font-size: 16px;

  cursor: pointer;

}


.btn:disabled {

  background: #aaa;

  cursor: not-allowed;

}


.modal-mask {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.58);

  display: none;

  align-items: center;

  justify-content: center;

  z-index: 9999;

  padding: 15px;

}


.modal {

  background: white;

  width:
    min(
      520px,
      100%
    );

  border-radius: 18px;

  padding: 24px;

  max-height: 92vh;

  overflow-y: auto;

}


.modal h2 {

  margin-top: 0;

  margin-bottom: 18px;

}


.info-line {

  margin: 8px 0;

  color: #555;

}


.info-line strong {

  color: #222;

}


.form-label {

  display: block;

  font-weight: bold;

  margin: 20px 0 7px;

}


.input {

  width: 100%;

  padding: 13px;

  border: 1px solid #ccc;

  border-radius: 10px;

  font-size: 17px;

}


.modal-buttons {

  display: flex;

  gap: 10px;

  margin-top: 22px;

}


.btn-cancel {

  flex: 1;

  background: #eee;

  color: #333;

}


.btn-submit {

  flex: 1;

  background: #06c755;

}


.btn-submit:disabled {

  background: #aaa;

}


.message {

  padding: 16px;

  border-radius: 10px;

  margin-top: 18px;

  white-space: pre-line;

}


.message.success {

  background: #e9f9ef;

  color: #008c4a;

}


.message.error {

  background: #fff0f0;

  color: #e53935;

}


.success-title {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 12px;

}


@media (
  max-width: 600px
) {

  .header h1 {

    font-size: 24px;

  }


  .session-card {

    padding: 15px;

  }


  .session-info h3 {

    font-size: 17px;

  }


  .btn {

    padding: 10px 14px;

  }

}

</style>

</head>


<body>


<div class="header">

  <h1>
    樂羽會館
  </h1>

  <p>
    羽球零打報名系統
  </p>

</div>


<div class="container">


  <div class="user-box">

    <div class="line-icon">
      LINE
    </div>


    <div>

      <div class="user-title">
        LINE 使用者
      </div>


      <div
        class="user-name"
        id="userName"
      >
        登入中...
      </div>

    </div>

  </div>


  <div id="errorArea"></div>


  <div
    id="loading"
    class="loading"
  >
    場次載入中...
  </div>


  <div id="sessionArea"></div>

</div>


<!-- ======================================================
     報名視窗
====================================================== -->

<div
  id="modalMask"
  class="modal-mask"
>

  <div class="modal">


    <h2>
      零打報名
    </h2>


    <div class="info-line">

      日期：

      <strong
        id="modalDate"
      ></strong>

    </div>


    <div class="info-line">

      梯次：

      <strong
        id="modalSession"
      ></strong>

    </div>


    <div class="info-line">

      時間：

      <strong
        id="modalTime"
      ></strong>

    </div>


    <div class="info-line">

      剩餘名額：

      <strong
        id="modalRemaining"
      ></strong>

    </div>


    <label class="form-label">

      姓名

    </label>


    <input
      id="nameInput"
      class="input"
      type="text"
      placeholder="請輸入姓名"
      autocomplete="name"
    >


    <label class="form-label">

      手機號碼

    </label>


    <input
      id="phoneInput"
      class="input"
      type="tel"
      placeholder="例如：0912345678"
      maxlength="10"
      inputmode="numeric"
      autocomplete="tel"
    >


    <div
      id="modalMessage"
    ></div>


    <div class="modal-buttons">


      <button
        id="cancelButton"
        class="btn btn-cancel"
        onclick="關閉視窗()"
      >

        取消

      </button>


      <button
        id="submitButton"
        class="btn btn-submit"
        onclick="送出報名()"
      >

        確認報名

      </button>


    </div>

  </div>

</div>


<script>


/************************************************************
 * 基本設定
 ************************************************************/

const LIFF_ID =
  "2011603755-U8bYBa4n";


const API_URL =
  "https://script.google.com/macros/s/AKfycbyFxTErNwhLKgIhDuuZwILEyC39oXwAEdzuPhl1uLvWsACZ5DzAlZIU5pCEjxxf8rAnyg/exec";


let currentUser = null;

let currentSession = null;

let lineIdToken = null;

let bookingIframe = null;

let bookingForm = null;


/************************************************************
 * LIFF 初始化
 ************************************************************/

async function 初始化() {

  try {


    await liff.init({

      liffId:
        LIFF_ID

    });


    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    /******************************************************
     * 使用者名稱只做畫面顯示
     ******************************************************/

    currentUser =
      await liff.getProfile();


    document
      .getElementById(
        "userName"
      )
      .textContent =
        currentUser.displayName ||
        "LINE 使用者";


    /******************************************************
     * 取得 ID Token
     ******************************************************/

    lineIdToken =
      liff.getIDToken();


    if (!lineIdToken) {

      throw new Error(
        "無法取得 LINE ID Token，請關閉此頁面後重新從 LINE 官方帳號開啟零打報名。"
      );

    }


    /******************************************************
     * 載入場次
     ******************************************************/

    await 載入場次();


  } catch (error) {

    console.error(
      "LIFF 初始化錯誤：",
      error
    );


    顯示錯誤(

      error.message ||
      "LINE LIFF 初始化失敗"

    );

  }

}


/************************************************************
 * 載入場次
 *
 * JSONP
 ************************************************************/

function 載入場次() {

  return new Promise(
    function(resolve, reject) {


      const callbackName =
        "liffSessions_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      const timeout =
        setTimeout(

          function() {

            cleanup();

            reject(
              new Error(
                "場次資料載入逾時"
              )
            );

          },

          15000

        );


      window[callbackName] =
        function(data) {


          cleanup();


          if (
            !data ||
            data.success !== true
          ) {

            reject(

              new Error(

                data &&
                data.message
                  ? data.message
                  : "無法取得場次資料"

              )

            );

            return;

          }


          try {

            顯示場次(
              data.sessions || []
            );


            resolve(data);


          } catch (error) {

            reject(error);

          }

        };


      script.src =

        API_URL +

        "?action=sessions" +

        "&callback=" +

        encodeURIComponent(
          callbackName
        ) +

        "&_=" +

        Date.now();


      script.onerror =
        function() {

          cleanup();

          reject(

            new Error(
              "無法連線到報名系統"
            )

          );

        };


      document.body.appendChild(
        script
      );


      function cleanup() {

        clearTimeout(
          timeout
        );


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (e) {}

      }

    }
  );

}


/************************************************************
 * 顯示場次
 ************************************************************/

function 顯示場次(
  sessions
) {

  document
    .getElementById(
      "loading"
    )
    .style.display =
      "none";


  const area =
    document.getElementById(
      "sessionArea"
    );


  area.innerHTML = "";


  if (
    !sessions ||
    sessions.length === 0
  ) {

    area.innerHTML =
      '<div class="loading">目前沒有可報名場次</div>';

    return;

  }


  let currentDate = "";


  sessions.forEach(
    function(session) {


      /****************************************************
       * 日期標題
       ****************************************************/

      if (
        session.date !==
        currentDate
      ) {

        currentDate =
          session.date;


        const dayTitle =
          document.createElement(
            "div"
          );


        dayTitle.className =
          "day-title";


        dayTitle.textContent =
          顯示日期(
            currentDate
          );


        area.appendChild(
          dayTitle
        );

      }


      /****************************************************
       * 場次卡片
       ****************************************************/

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "session-card";


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "session-info";


      const title =
        document.createElement(
          "h3"
        );


      title.textContent =
        "第 " +
        session.sessionId +
        " 梯";


      const time =
        document.createElement(
          "div"
        );


      time.className =
        "session-time";


      time.textContent =
        session.startTime +
        " – " +
        session.endTime;


      const count =
        document.createElement(
          "div"
        );


      count.className =
        "session-count";


      if (
        Number(
          session.remaining
        ) <= 0
      ) {

        count.classList.add(
          "session-full"
        );


        count.textContent =
          "已額滿";


      } else {

        count.textContent =

          "已報名 " +
          session.booked +
          " 人｜剩餘 " +
          session.remaining +
          " 人";

      }


      info.appendChild(
        title
      );


      info.appendChild(
        time
      );


      info.appendChild(
        count
      );


      /****************************************************
       * 報名按鈕
       ****************************************************/

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "btn";


      button.textContent =

        Number(
          session.remaining
        ) <= 0

          ? "已額滿"

          : "立即報名";


      button.disabled =

        Number(
          session.remaining
        ) <= 0;


      button.onclick =
        function() {

          開啟報名視窗(
            session
          );

        };


      card.appendChild(
        info
      );


      card.appendChild(
        button
      );


      area.appendChild(
        card
      );

    }
  );

}


/************************************************************
 * 顯示日期
 ************************************************************/

function 顯示日期(
  dateString
) {

  const parts =
    dateString.split("-");


  if (
    parts.length !== 3
  ) {

    return dateString;

  }


  const date =
    new Date(

      Number(parts[0]),

      Number(parts[1]) - 1,

      Number(parts[2])

    );


  const week =
    [
      "日",
      "一",
      "二",
      "三",
      "四",
      "五",
      "六"
    ][
      date.getDay()
    ];


  return (

    parts[1] +
    "/" +
    parts[2] +
    " 星期" +
    week

  );

}


/************************************************************
 * 開啟報名視窗
 ************************************************************/

function 開啟報名視窗(
  session
) {

  currentSession =
    session;


  document
    .getElementById(
      "modalDate"
    )
    .textContent =

      session.date
        .substring(5)
        .replace(
          "-",
          "/"
        );


  document
    .getElementById(
      "modalSession"
    )
    .textContent =

      "第 " +
      session.sessionId +
      " 梯";


  document
    .getElementById(
      "modalTime"
    )
    .textContent =

      session.startTime +
      " – " +
      session.endTime;


  document
    .getElementById(
      "modalRemaining"
    )
    .textContent =

      session.remaining +
      " 人";


  document
    .getElementById(
      "modalMessage"
    )
    .innerHTML = "";


  document
    .getElementById(
      "submitButton"
    )
    .disabled =
      false;


  document
    .getElementById(
      "submitButton"
    )
    .textContent =
      "確認報名";


  document
    .getElementById(
      "modalMask"
    )
    .style.display =
      "flex";


  setTimeout(
    function() {

      document
        .getElementById(
          "nameInput"
        )
        .focus();

    },
    100
  );

}


/************************************************************
 * 關閉視窗
 ************************************************************/

function 關閉視窗() {

  清理POST資源();


  document
    .getElementById(
      "modalMask"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "modalMessage"
    )
    .innerHTML = "";


  document
    .getElementById(
      "submitButton"
    )
    .disabled =
      false;


  document
    .getElementById(
      "submitButton"
    )
    .textContent =
      "確認報名";

}


/************************************************************
 * 送出報名
 ************************************************************/

async function 送出報名() {


  const name =
    document
      .getElementById(
        "nameInput"
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        "phoneInput"
      )
      .value
      .trim();


  /******************************************************
   * 姓名
   ******************************************************/

  if (!name) {

    顯示Modal錯誤(
      "請輸入姓名"
    );

    return;

  }


  /******************************************************
   * 手機
   ******************************************************/

  if (
    !/^09\d{8}$/.test(
      phone
    )
  ) {

    顯示Modal錯誤(
      "手機號碼格式錯誤，請輸入 10 碼手機號碼"
    );

    return;

  }


  if (!currentSession) {

    顯示Modal錯誤(
      "場次資料不存在，請重新整理頁面"
    );

    return;

  }


  /******************************************************
   * 每次按報名重新取得 ID Token
   ******************************************************/

  try {

    lineIdToken =
      liff.getIDToken();

  } catch (error) {

    console.error(
      "取得 ID Token 失敗",
      error
    );


    顯示Modal錯誤(
      "無法取得 LINE 身分驗證資料，請重新開啟報名頁面。"
    );


    return;

  }


  if (!lineIdToken) {

    顯示Modal錯誤(

      "LINE ID Token 不存在。\n\n" +
      "請關閉目前頁面，再從 LINE 官方帳號重新開啟「零打報名」。"

    );

    return;

  }


  /******************************************************
   * 唯一 request_id
   ******************************************************/

  const requestId =

    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 10);


  const submitButton =
    document.getElementById(
      "submitButton"
    );


  submitButton.disabled =
    true;


  submitButton.textContent =
    "報名處理中...";


  顯示Modal訊息(
    "正在確認報名資料..."
  );


  try {


    /****************************************************
     * POST
     *
     * 不直接讀 iframe 回應，
     * 改用 bookingStatus 查詢。
     ****************************************************/

    送出POST表單({

      request_id:
        requestId,

      date:
        currentSession.date,

      session_id:
        currentSession.sessionId,

      name:
        name,

      phone:
        phone,

      id_token:
        lineIdToken

    });


    /****************************************************
     * 等待後端結果
     ****************************************************/

    const result =
      await 等待報名結果(
        requestId
      );


    if (
      result &&
      result.success === true
    ) {

      顯示報名成功(
        result
      );

      return;

    }


    throw new Error(

      result &&
      result.message

        ? result.message

        : "報名失敗"

    );


  } catch (error) {

    console.error(
      "報名錯誤：",
      error
    );


    顯示Modal錯誤(

      error.message ||
      "報名失敗，請稍後再試"

    );


    submitButton.disabled =
      false;


    submitButton.textContent =
      "確認報名";


    清理POST資源();

  }

}


/************************************************************
 * POST 表單
 *
 * 使用：
 * HTML Form + 隱藏 iframe
 *
 * 避免 GitHub Pages CORS 問題
 ************************************************************/

function 送出POST表單(
  data
) {


  清理POST資源();


  const iframeName =
    "booking_iframe_" +
    Date.now();


  bookingIframe =
    document.createElement(
      "iframe"
    );


  bookingIframe.name =
    iframeName;


  bookingIframe.style.display =
    "none";


  document.body.appendChild(
    bookingIframe
  );


  bookingForm =
    document.createElement(
      "form"
    );


  bookingForm.method =
    "POST";


  bookingForm.action =
    API_URL;


  bookingForm.target =
    iframeName;


  bookingForm.style.display =
    "none";


  Object.keys(data)
    .forEach(
      function(key) {


        const input =
          document.createElement(
            "input"
          );


        input.type =
          "hidden";


        input.name =
          key;


        input.value =
          data[key];


        bookingForm.appendChild(
          input
        );

      }
    );


  document.body.appendChild(
    bookingForm
  );


  /******************************************************
   * 開始 POST
   ******************************************************/

  bookingForm.submit();


  /******************************************************
   * ★ 重要
   *
   * 不再 800ms 後刪除 iframe。
   *
   * 最多保留 45 秒。
   ******************************************************/

  setTimeout(
    function() {

      清理POST資源();

    },
    45000
  );

}


/************************************************************
 * 等待報名結果
 *
 * 最多約 30 秒
 *
 * JSONP 單次失敗：
 * 不立即判定報名失敗
 * 而是繼續重試。
 ************************************************************/

async function 等待報名結果(
  requestId
) {


  for (
    let i = 0;
    i < 30;
    i++
  ) {


    await 等待(

      i === 0
        ? 500
        : 1000

    );


    try {


      const result =
        await 查詢報名狀態(
          requestId
        );


      if (!result) {

        continue;

      }


      if (
        result.success === true
      ) {

        return result;

      }


      if (
        result.status ===
        "failed"
      ) {

        throw new Error(

          result.message ||
          "報名失敗"

        );

      }


      // processing
      // 繼續查詢


    } catch (error) {


      /*
       * JSONP 網路問題：
       * 不要立刻告訴使用者報名失敗。
       *
       * 因為 POST 可能已經成功寫入 Google Sheet。
       */

      console.warn(

        "bookingStatus 查詢失敗，繼續重試：",

        error

      );

    }

  }


  throw new Error(

    "報名處理時間較長。\n" +
    "請重新整理頁面後確認是否已報名；" +
    "若 Google 試算表已有資料，請勿再次重複報名。"

  );

}


/************************************************************
 * 查詢報名狀態
 *
 * JSONP
 ************************************************************/

function 查詢報名狀態(
  requestId
) {


  return new Promise(
    function(resolve, reject) {


      const callbackName =

        "bookingStatus_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() *
          100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {


            if (finished) {

              return;

            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "本次狀態查詢逾時"
              )
            );


          },
          8000
        );


      window[callbackName] =
        function(data) {


          if (finished) {

            return;

          }


          finished =
            true;


          cleanup();


          resolve(data);

        };


      script.src =

        API_URL +

        "?action=bookingStatus" +

        "&request_id=" +

        encodeURIComponent(
          requestId
        ) +

        "&callback=" +

        encodeURIComponent(
          callbackName
        ) +

        "&_=" +

        Date.now();


      script.onerror =
        function() {


          if (finished) {

            return;

          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "本次狀態查詢連線失敗"
            )
          );

        };


      document.body.appendChild(
        script
      );


      function cleanup() {


        clearTimeout(
          timeout
        );


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (e) {}

      }

    }
  );

}

      "🎉 報名成功！" +

      result.date || ""
    ) +

    "<br>" +

    escapeHtml(
      result.sessionId || ""
    ) +
    " 梯" +

    "<br>" +

    escapeHtml(
      result.startTime || ""
    ) +

    " – " +

    escapeHtml(
      result.endTime || ""
    ) +

    "<br><br>" +

    "報名編號：" +

    escapeHtml(
      result.bookingId || ""
    ) +

    "<br><br>" +

  const submitButton =

    );

   ******************************************************/

  );

/************************************************************
 * HTML 安全處理
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/************************************************************
 * 清理 POST iframe
 ************************************************************/

function 清理POST資源() {


  if (
    bookingForm &&
    bookingForm.parentNode
  ) {

    try {

      bookingForm.parentNode
        .removeChild(
          bookingForm
        );

    } catch (e) {}

  }


  if (
    bookingIframe &&
    bookingIframe.parentNode
  ) {

    try {

      bookingIframe.parentNode
        .removeChild(
          bookingIframe
        );

    } catch (e) {}

  }


  bookingForm =
    null;


  bookingIframe =
    null;

}

 ************************************************************/

function 等待(
  ms
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}
