<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>樂羽會館｜零打報名</title>

  <!-- LINE LIFF SDK -->
  <script charset="utf-8"
          src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .header {
      background: #111;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 2px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
      opacity: 0.85;
    }

    .user-box {
      background: white;
      margin: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #06c755;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .user-name {
      font-size: 16px;
      font-weight: bold;
    }

    .container {
      padding: 0 14px 30px;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #666;
    }

    .date-title {
      margin: 22px 0 10px;
      font-size: 19px;
      font-weight: bold;
      border-left: 5px solid #111;
      padding-left: 10px;
    }

    .date-week {
      color: #666;
      font-size: 14px;
      margin-left: 6px;
      font-weight: normal;
    }

    .session-card {
      background: white;
      border-radius: 13px;
      margin-bottom: 10px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .session-info {
      min-width: 0;
    }

    .session-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .session-time {
      color: #555;
      font-size: 15px;
    }

    .session-status {
      margin-top: 7px;
      font-size: 14px;
    }

    .available {
      color: #06a04b;
    }

    .full {
      color: #d93025;
    }

    .session-btn {
      border: none;
      border-radius: 9px;
      background: #111;
      color: white;
      padding: 10px 15px;
      font-size: 15px;
      white-space: nowrap;
      cursor: pointer;
    }

    .session-btn:disabled {
      background: #bbb;
      cursor: not-allowed;
    }

    .refresh-btn {
      display: block;
      margin: 22px auto 0;
      border: 1px solid #bbb;
      background: white;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
    }

    /* 彈窗 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      padding: 20px;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 430px;
      margin: 60px auto 0;
      border-radius: 16px;
      padding: 22px;
      position: relative;
    }

    .modal-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .modal-subtitle {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #111;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .cancel-btn,
    .submit-btn {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-size: 16px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #eee;
      color: #333;
    }

    .submit-btn {
      background: #06c755;
      color: white;
      font-weight: bold;
    }

    .submit-btn:disabled {
      background: #aaa;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.success {
      display: block;
      background: #e8f8ee;
      color: #087a39;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 25px 10px;
    }

    /* 隱藏 POST iframe */
    #postFrame {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>樂羽會館</h1>
    <p>羽球零打報名系統</p>
  </div>

  <div class="user-box">
    <div class="user-icon">LINE</div>
    <div>
      <div style="font-size:13px;color:#777;">LINE 使用者</div>
      <div class="user-name" id="userName">登入中...</div>
    </div>
  </div>

  <div class="container">

    <div id="loading" class="loading">
      正在載入零打場次...
    </div>

    <div id="sessionList"></div>

    <button class="refresh-btn" onclick="loadSessions()">
      ↻ 重新整理場次
    </button>

  </div>

  <div class="footer">
    樂羽會館｜羽球零打報名
  </div>


  <!-- 報名彈窗 -->
  <div id="bookingModal" class="modal">

    <div class="modal-content">

      <div class="modal-title">零打報名</div>

      <div id="selectedSession"
           class="modal-subtitle">
      </div>

      <div class="form-group">
        <label>姓名</label>
        <input
          type="text"
          id="name"
          placeholder="請輸入姓名"
          maxlength="20">
      </div>

      <div class="form-group">
        <label>手機號碼</label>
        <input
          type="tel"
          id="phone"
          placeholder="例如：0912345678"
          maxlength="10"
          inputmode="numeric">
      </div>

      <div id="message"
           class="message">
      </div>

      <div class="modal-buttons">
        <button
          class="cancel-btn"
          onclick="closeModal()">
          取消
        </button>

        <button
          id="submitBtn"
          class="submit-btn"
          onclick="submitBooking()">
          確認報名
        </button>
      </div>

    </div>

  </div>


  <!-- 跨網域 POST 使用 -->
  <iframe name="postFrame"
          id="postFrame"></iframe>


  <script>

    /*************************************************
     * 基本設定
     *************************************************/

    const LIFF_ID = "2011603755-U8bYBa4n";

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyFxTErNwhLKgIhDuuZwILEyC39oXwAEdzuPhl1uLvWsACZ5DzAlZIU5pCEjxxf8rAnyg/exec";


    let lineProfile = null;
    let lineIdToken = null;

    let selectedDate = "";
    let selectedSessionId = "";

    let loadingSessions = false;
    let bookingInProgress = false;


    /*************************************************
     * 頁面初始化
     *************************************************/

    window.addEventListener("load", async function() {

      try {

        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // 取得 LINE 個人資料
        lineProfile = await liff.getProfile();

        document.getElementById("userName").textContent =
          lineProfile.displayName || "LINE 使用者";

        // 取得 ID Token
        lineIdToken = liff.getIDToken();

        if (!lineIdToken) {
          throw new Error("無法取得 LINE ID Token");
        }

        // 載入零打場次
        loadSessions();

      } catch (error) {

        console.error(error);

        document.getElementById("loading").innerHTML =
          "LINE 登入失敗，請關閉頁面後重新開啟。<br><br>" +
          "<small>" + escapeHtml(error.message || "") + "</small>";

      }

    });


    /*************************************************
     * JSONP：取得零打場次
     *************************************************/

    function loadSessions() {

      if (loadingSessions) {
        return;
      }

      loadingSessions = true;

      document.getElementById("loading").style.display = "block";

      document.getElementById("loading").textContent =
        "正在載入零打場次...";

      document.getElementById("sessionList").innerHTML = "";

      const callbackName =
        "sessionsCallback_" + Date.now();

      window[callbackName] = function(data) {

        try {

          if (!data || !data.success) {
            throw new Error(
              data && data.message
                ? data.message
                : "無法取得場次資料"
            );
          }

          renderSessions(data.sessions || []);

        } catch (error) {

          console.error(error);

          document.getElementById("loading").textContent =
            "場次載入失敗：" + error.message;

        }

        loadingSessions = false;

        delete window[callbackName];

        const script = document.getElementById(callbackName);

        if (script) {
          script.remove();
        }

      };


      const script = document.createElement("script");

      script.id = callbackName;

      script.src =
        API_URL +
        "?action=sessions" +
        "&callback=" +
        encodeURIComponent(callbackName) +
        "&_=" +
        Date.now();

      script.onerror = function() {

        document.getElementById("loading").textContent =
          "無法連線到報名系統，請稍後再試。";

        loadingSessions = false;

        delete window[callbackName];

        script.remove();
      };

      document.body.appendChild(script);
    }


    /*************************************************
     * 顯示零打場次
     *************************************************/

    function renderSessions(sessions) {

      const container =
        document.getElementById("sessionList");

      container.innerHTML = "";

      document.getElementById("loading").style.display =
        "none";


      if (!sessions || sessions.length === 0) {

        container.innerHTML =
          '<div class="loading">目前沒有可報名的零打場次。</div>';

        return;
      }


      // 按日期分組
      const grouped = {};

      sessions.forEach(function(session) {

        if (!grouped[session.date]) {
          grouped[session.date] = [];
        }

        grouped[session.date].push(session);

      });


      Object.keys(grouped).forEach(function(date) {

        const dateTitle =
          document.createElement("div");

        dateTitle.className = "date-title";

        dateTitle.innerHTML =
          formatDate(date) +
          '<span class="date-week">' +
          getWeekday(date) +
          "</span>";

        container.appendChild(dateTitle);


        grouped[date].forEach(function(session) {

          const card =
            document.createElement("div");

          card.className = "session-card";


          const info =
            document.createElement("div");

          info.className = "session-info";


          const sessionName =
            document.createElement("div");

          sessionName.className = "session-name";

          sessionName.textContent =
            "第 " + session.sessionId + " 梯";


          const time =
            document.createElement("div");

          time.className = "session-time";

          time.textContent =
            session.startTime +
            " – " +
            session.endTime;


          const status =
            document.createElement("div");

          status.className =
            "session-status " +
            (
              Number(session.remaining) > 0
                ? "available"
                : "full"
            );


          if (Number(session.remaining) > 0) {

            status.textContent =
              "已報名 " +
              session.booked +
              " 人｜剩餘 " +
              session.remaining +
              " 人";

          } else {

            status.textContent =
              "已額滿";

          }


          info.appendChild(sessionName);
          info.appendChild(time);
          info.appendChild(status);


          const button =
            document.createElement("button");

          button.className = "session-btn";

          button.textContent =
            Number(session.remaining) > 0
              ? "立即報名"
              : "已額滿";


          button.disabled =
            Number(session.remaining) <= 0;


          if (!button.disabled) {

            button.onclick = function() {

              openBooking(
                session.date,
                session.sessionId,
                session.startTime,
                session.endTime,
                session.remaining
              );

            };

          }


          card.appendChild(info);
          card.appendChild(button);

          container.appendChild(card);

        });

      });

    }


    /*************************************************
     * 開啟報名視窗
     *************************************************/

    function openBooking(
      date,
      sessionId,
      startTime,
      endTime,
      remaining
    ) {

      selectedDate = date;

      selectedSessionId = String(sessionId);

      document.getElementById("selectedSession").innerHTML =
        "日期：<strong>" +
        formatDate(date) +
        "</strong><br>" +
        "梯次：<strong>第 " +
        escapeHtml(String(sessionId)) +
        " 梯</strong><br>" +
        "時間：<strong>" +
        escapeHtml(startTime) +
        " – " +
        escapeHtml(endTime) +
        "</strong><br>" +
        "剩餘名額：<strong>" +
        remaining +
        " 人</strong>";


      document.getElementById("name").value = "";

      document.getElementById("phone").value = "";

      clearMessage();

      document.getElementById("submitBtn").disabled = false;

      document.getElementById("submitBtn").textContent =
        "確認報名";


      document.getElementById("bookingModal").style.display =
        "block";

    }


    /*************************************************
     * 關閉報名視窗
     *************************************************/

    function closeModal() {

      if (bookingInProgress) {
        return;
      }

      document.getElementById("bookingModal").style.display =
        "none";

    }


    /*************************************************
     * 執行報名
     *************************************************/

    function submitBooking() {

      if (bookingInProgress) {
        return;
      }


      const name =
        document.getElementById("name").value.trim();

      const phone =
        document.getElementById("phone").value.trim();


      if (!name) {

        showMessage(
          "請輸入姓名。",
          "error"
        );

        return;
      }


      if (!/^09\d{8}$/.test(phone)) {

        showMessage(
          "請輸入正確的手機號碼，例如：0912345678",
          "error"
        );

        return;
      }


      if (!lineIdToken) {

        showMessage(
          "LINE 身分驗證失效，請重新開啟報名頁。",
          "error"
        );

        return;
      }


      bookingInProgress = true;

      document.getElementById("submitBtn").disabled = true;

      document.getElementById("submitBtn").textContent =
        "報名處理中...";

      clearMessage();


      // 每次報名建立唯一 request ID
      const requestId =
        "REQ_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 10);


      /*
       * 使用 HTML Form POST 到 GAS。
       *
       * 不使用 fetch，
       * 因為 GAS Web App 的跨網域 CORS
       * 可能造成瀏覽器阻擋。
       */

      const form =
        document.createElement("form");

      form.method = "POST";

      form.action = API_URL;

      form.target = "postFrame";

      form.style.display = "none";


      addHiddenInput(
        form,
        "request_id",
        requestId
      );

      addHiddenInput(
        form,
        "date",
        selectedDate
      );

      addHiddenInput(
        form,
        "session_id",
        selectedSessionId
      );

      addHiddenInput(
        form,
        "name",
        name
      );

      addHiddenInput(
        form,
        "phone",
        phone
      );

      addHiddenInput(
        form,
        "id_token",
        lineIdToken
      );


      document.body.appendChild(form);

      form.submit();

      form.remove();


      // 等待 GAS 處理結果
      pollBookingStatus(requestId);

    }


    /*************************************************
     * 建立隱藏表單欄位
     *************************************************/

    function addHiddenInput(form, name, value) {

      const input =
        document.createElement("input");

      input.type = "hidden";

      input.name = name;

      input.value = value;

      form.appendChild(input);

    }


    /*************************************************
     * 查詢報名結果
     *************************************************/

    function pollBookingStatus(requestId) {

      let attempts = 0;

      const maxAttempts = 30;

      const interval = 1000;


      function check() {

        attempts++;


        const callbackName =
          "bookingCallback_" +
          Date.now() +
          "_" +
          attempts;


        window[callbackName] = function(data) {

          try {

            if (
              data &&
              data.status === "success"
            ) {

              showMessage(
                "🎉 報名成功！<br><br>" +
                "日期：" +
                formatDate(selectedDate) +
                "<br>" +
                "第 " +
                escapeHtml(selectedSessionId) +
                " 梯<br><br>" +
                "請準時到場。",
                "success"
              );


              document.getElementById("submitBtn").textContent =
                "報名成功";


              bookingInProgress = false;


              // 重新取得最新名額
              setTimeout(function() {

                loadSessions();

              }, 1000);


              cleanup();

              return;
            }


            if (
              data &&
              data.status === "error"
            ) {

              showMessage(
                data.message ||
                "報名失敗，請稍後再試。",
                "error"
              );


              document.getElementById("submitBtn").disabled =
                false;

              document.getElementById("submitBtn").textContent =
                "確認報名";


              bookingInProgress = false;

              cleanup();

              return;
            }


            // 還在處理中
            if (attempts < maxAttempts) {

              cleanup();

              setTimeout(
                check,
                interval
              );

              return;

            }


            showMessage(
              "系統處理時間較長，請重新整理場次確認報名結果。",
              "error"
            );


            document.getElementById("submitBtn").disabled =
              false;

            document.getElementById("submitBtn").textContent =
              "確認報名";


            bookingInProgress = false;

            cleanup();

          } catch (error) {

            console.error(error);

            cleanup();

            if (attempts < maxAttempts) {

              setTimeout(
                check,
                interval
              );

            } else {

              showMessage(
                "無法確認報名結果，請重新整理場次。",
                "error"
              );

              document.getElementById("submitBtn").disabled =
                false;

              document.getElementById("submitBtn").textContent =
                "確認報名";

              bookingInProgress = false;

            }

          }

        };


        const script =
          document.createElement("script");

        script.id = callbackName;

        script.src =
          API_URL +
          "?action=bookingStatus" +
          "&request_id=" +
          encodeURIComponent(requestId) +
          "&callback=" +
          encodeURIComponent(callbackName) +
          "&_=" +
          Date.now();


        script.onerror = function() {

          cleanup();

          if (attempts < maxAttempts) {

            setTimeout(
              check,
              interval
            );

          } else {

            showMessage(
              "無法確認報名結果，請稍後重新整理。",
              "error"
            );

            document.getElementById("submitBtn").disabled =
              false;

            document.getElementById("submitBtn").textContent =
              "確認報名";

            bookingInProgress = false;

          }

        };


        document.body.appendChild(script);


        function cleanup() {

          delete window[callbackName];

          const oldScript =
            document.getElementById(callbackName);

          if (oldScript) {
            oldScript.remove();
          }

        }

      }


      check();

    }


    /*************************************************
     * 顯示訊息
     *************************************************/

    function showMessage(text, type) {

      const box =
        document.getElementById("message");

      box.className =
        "message " + type;

      box.innerHTML = text;

    }


    function clearMessage() {

      const box =
        document.getElementById("message");

      box.className = "message";

      box.innerHTML = "";

    }


    /*************************************************
     * 日期格式
     *************************************************/

    function formatDate(dateString) {

      const parts =
        dateString.split("-");

      if (parts.length !== 3) {
        return dateString;
      }

      return (
        parts[1] +
        "/" +
        parts[2]
      );

    }


    /*************************************************
     * 星期
     *************************************************/

    function getWeekday(dateString) {

      const date =
        new Date(
          dateString + "T00:00:00"
        );

      const weekdays = [
        "星期日",
        "星期一",
        "星期二",
        "星期三",
        "星期四",
        "星期五",
        "星期六"
      ];

      return weekdays[
        date.getDay()
      ];

    }


    /*************************************************
     * HTML 安全處理
     *************************************************/

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*************************************************
     * 點擊彈窗外部關閉
     *************************************************/

    window.addEventListener(
      "click",
      function(event) {

        const modal =
          document.getElementById("bookingModal");

        if (event.target === modal) {

          closeModal();

        }

      }
    );

  </script>

</body>
</html>
