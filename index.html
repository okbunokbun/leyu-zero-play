<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>樂羽會館｜羽球零打報名系統</title>

  <script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;
    }

    .header {
      background: #111;
      color: white;
      text-align: center;
      padding: 22px 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 15px;
      color: #ddd;
    }

    .container {
      width: min(1100px, calc(100% - 24px));
      margin: 16px auto 40px;
    }

    .user-box {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);

      display: flex;
      align-items: center;
      gap: 14px;
    }

    .line-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #06c755;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 15px;
      font-weight: bold;
    }

    .user-title {
      font-size: 14px;
      color: #777;
    }

    .user-name {
      margin-top: 3px;
      font-size: 17px;
      font-weight: 700;
    }

    .loading {
      background: white;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .error-box {
      background: #fff0f0;
      color: #e53935;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      line-height: 1.7;
    }

    .date-title {
      font-size: 22px;
      font-weight: 700;
      margin: 22px 0 10px;
      padding-left: 10px;
      border-left: 5px solid #111;
    }

    .session-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 10px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .session-info {
      min-width: 0;
    }

    .session-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .session-time {
      font-size: 16px;
      color: #555;
      margin-bottom: 7px;
    }

    .session-count {
      font-size: 15px;
      color: #009b5a;
    }

    .session-full {
      color: #e53935;
    }

    .signup-btn {
      border: none;
      background: #111;
      color: white;

      min-width: 105px;
      padding: 12px 16px;

      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }

    .signup-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    /* Modal */

    .modal-bg {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.58);

      z-index: 9999;

      align-items: center;
      justify-content: center;

      padding: 18px;
    }

    .modal {
      width: min(480px, 100%);
      background: white;
      border-radius: 18px;
      padding: 22px;

      box-shadow: 0 10px 40px rgba(0,0,0,.25);
    }

    .modal h2 {
      margin: 0 0 16px;
      font-size: 23px;
    }

    .modal-info {
      line-height: 1.75;
      margin-bottom: 15px;
      color: #444;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      height: 46px;

      border: 1px solid #ccc;
      border-radius: 9px;

      padding: 0 12px;

      font-size: 16px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #111;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .cancel-btn,
    .confirm-btn {
      flex: 1;

      height: 48px;
      border: none;
      border-radius: 10px;

      font-size: 16px;
      font-weight: 700;
    }

    .cancel-btn {
      background: #eee;
      color: #333;
    }

    .confirm-btn {
      background: #06c755;
      color: white;
    }

    .confirm-btn:disabled {
      background: #aaa;
    }

    .success-box {
      background: #e9f9ef;
      color: #008a4b;

      border-radius: 12px;
      padding: 15px;

      line-height: 1.8;
      margin-top: 12px;
    }

    .fail-box {
      background: #fff0f0;
      color: #d93025;

      border-radius: 12px;
      padding: 15px;

      line-height: 1.8;
      margin-top: 12px;
    }

    .hidden-frame {
      display: none;
    }

    @media (max-width: 600px) {

      .header {
        padding: 18px 12px;
      }

      .header h1 {
        font-size: 24px;
      }

      .container {
        width: calc(100% - 16px);
      }

      .session-card {
        padding: 15px;
      }

      .session-name {
        font-size: 17px;
      }

      .session-time {
        font-size: 15px;
      }

      .session-count {
        font-size: 14px;
      }

      .signup-btn {
        min-width: 90px;
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>樂羽會館</h1>
    <p>羽球零打報名系統</p>
  </div>

  <div class="container">

    <div class="user-box">
      <div class="line-icon">LINE</div>

      <div>
        <div class="user-title">LINE 使用者</div>
        <div class="user-name" id="userName">登入中...</div>
      </div>
    </div>

    <div id="errorArea"></div>

    <div id="loadingArea" class="loading">
      正在載入零打場次...
    </div>

    <div id="sessionsArea"></div>

  </div>


  <!-- 報名視窗 -->

  <div id="modalBg" class="modal-bg">

    <div class="modal">

      <h2>零打報名</h2>

      <div class="modal-info">

        <div>
          日期：
          <strong id="modalDate"></strong>
        </div>

        <div>
          梯次：
          <strong id="modalSession"></strong>
        </div>

        <div>
          時間：
          <strong id="modalTime"></strong>
        </div>

        <div>
          剩餘名額：
          <strong id="modalRemaining"></strong>
        </div>

      </div>


      <div class="form-group">
        <label for="nameInput">姓名</label>

        <input
          id="nameInput"
          type="text"
          maxlength="20"
          autocomplete="name"
          placeholder="請輸入姓名"
        >
      </div>


      <div class="form-group">
        <label for="phoneInput">手機號碼</label>

        <input
          id="phoneInput"
          type="tel"
          maxlength="10"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="例如：0912345678"
        >
      </div>


      <div id="resultArea"></div>


      <div class="modal-buttons">

        <button
          id="cancelBtn"
          class="cancel-btn"
          onclick="closeModal()"
        >
          取消
        </button>

        <button
          id="confirmBtn"
          class="confirm-btn"
          onclick="submitBooking()"
        >
          確認報名
        </button>

      </div>

    </div>

  </div>


  <!-- 隱藏 iframe：用於跨網域 POST -->

  <iframe
    name="bookingFrame"
    id="bookingFrame"
    class="hidden-frame">
  </iframe>


<script>

  /* =====================================================
     基本設定
  ===================================================== */

  const LIFF_ID = "2011603755-U8bYBa4n";

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyFxTErNwhLKgIhDuuZwILEyC39oXwAEdzuPhl1uLvWsACZ5DzAlZIU5pCEjxxf8rAnyg/exec";


  /* =====================================================
     系統變數
  ===================================================== */

  let currentUser = null;

  let currentIDToken = "";

  let selectedSession = null;

  let bookingRequestId = "";

  let bookingTimer = null;

  let jsonpCounter = 0;


  /* =====================================================
     頁面初始化
  ===================================================== */

  window.addEventListener("load", init);


  async function init() {

    try {

      /*
       * 初始化 LIFF
       */

      await liff.init({
        liffId: LIFF_ID,
        withLoginOnExternalBrowser: true
      });


      /*
       * 如果尚未登入 LINE
       */

      if (!liff.isLoggedIn()) {

        liff.login();

        return;
      }


      /*
       * 取得 LINE 使用者資料
       */

      currentUser = await liff.getProfile();

      document.getElementById("userName").textContent =
        currentUser.displayName || "LINE 使用者";


      /*
       * 取得 ID Token
       */

      currentIDToken = liff.getIDToken();

      if (!currentIDToken) {

        throw new Error("無法取得 LINE ID Token");

      }


      /*
       * 載入場次
       */

      loadSessions();

    }

    catch (error) {

      console.error(error);

      showError(
        "LINE 初始化失敗：" +
        (error.message || error)
      );

    }

  }


  /* =====================================================
     JSONP 載入場次
  ===================================================== */

  function loadSessions() {

    document.getElementById("loadingArea").style.display =
      "block";

    document.getElementById("sessionsArea").innerHTML = "";

    document.getElementById("errorArea").innerHTML = "";


    const callbackName =
      "sessionsCallback_" +
      Date.now() +
      "_" +
      (++jsonpCounter);


    window[callbackName] = function(data) {

      try {

        delete window[callbackName];

        const script =
          document.getElementById(callbackName);

        if (script) {

          script.remove();

        }


        document.getElementById("loadingArea").style.display =
          "none";


        if (!data || data.success !== true) {

          showError(
            data && data.message
              ? data.message
              : "無法取得零打場次"
          );

          return;
        }


        renderSessions(data.sessions || []);

      }

      catch (error) {

        console.error(error);

        showError(
          "場次資料處理失敗：" +
          error.message
        );

      }

    };


    const script = document.createElement("script");

    script.id = callbackName;

    script.src =
      API_URL +
      "?action=sessions" +
      "&callback=" +
      encodeURIComponent(callbackName) +
      "&_=" +
      Date.now();


    script.onerror = function() {

      delete window[callbackName];

      script.remove();

      document.getElementById("loadingArea").style.display =
        "none";


      showError(
        "無法連線到報名系統，請重新整理頁面。"
      );

    };


    document.body.appendChild(script);


    /*
     * 15 秒逾時
     */

    setTimeout(function() {

      if (window[callbackName]) {

        delete window[callbackName];

        if (script.parentNode) {

          script.remove();

        }

        document.getElementById("loadingArea").style.display =
          "none";

        showError(
          "報名系統連線逾時，請重新整理頁面。"
        );

      }

    }, 15000);

  }


  /* =====================================================
     顯示場次
  ===================================================== */

  function renderSessions(sessions) {

    const area =
      document.getElementById("sessionsArea");

    area.innerHTML = "";


    if (!sessions.length) {

      showError("目前沒有開放的零打場次。");

      return;

    }


    /*
     * 依日期分組
     */

    const grouped = {};

    sessions.forEach(function(session) {

      if (!grouped[session.date]) {

        grouped[session.date] = [];

      }

      grouped[session.date].push(session);

    });


    Object.keys(grouped).sort().forEach(function(date) {

      const dateTitle =
        document.createElement("div");

      dateTitle.className =
        "date-title";

      dateTitle.textContent =
        formatDateTitle(date);

      area.appendChild(dateTitle);


      grouped[date].forEach(function(session) {

        const card =
          document.createElement("div");

        card.className =
          "session-card";


        const info =
          document.createElement("div");

        info.className =
          "session-info";


        const sessionName =
          document.createElement("div");

        sessionName.className =
          "session-name";

        sessionName.textContent =
          "第 " + session.sessionId + " 梯";


        const time =
          document.createElement("div");

        time.className =
          "session-time";

        time.textContent =
          session.startTime +
          " – " +
          session.endTime;


        const count =
          document.createElement("div");

        count.className =
          "session-count";


        if (Number(session.remaining) <= 0) {

          count.classList.add("session-full");

          count.textContent =
            "已額滿";

        }

        else {

          count.textContent =
            "已報名 " +
            session.booked +
            " 人｜剩餘 " +
            session.remaining +
            " 人";

        }


        info.appendChild(sessionName);

        info.appendChild(time);

        info.appendChild(count);


        const button =
          document.createElement("button");

        button.className =
          "signup-btn";

        button.textContent =
          Number(session.remaining) <= 0
            ? "已額滿"
            : "立即報名";


        button.disabled =
          Number(session.remaining) <= 0;


        button.onclick = function() {

          openModal(session);

        };


        card.appendChild(info);

        card.appendChild(button);

        area.appendChild(card);

      });

    });

  }


  /* =====================================================
     日期顯示
  ===================================================== */

  function formatDateTitle(dateString) {

    const parts =
      dateString.split("-");

    if (parts.length !== 3) {

      return dateString;

    }

    const year =
      Number(parts[0]);

    const month =
      Number(parts[1]);

    const day =
      Number(parts[2]);


    const date =
      new Date(year, month - 1, day);


    const weekdays = [
      "星期日",
      "星期一",
      "星期二",
      "星期三",
      "星期四",
      "星期五",
      "星期六"
    ];


    return (
      String(month).padStart(2, "0") +
      "/" +
      String(day).padStart(2, "0") +
      " " +
      weekdays[date.getDay()]
    );

  }


  /* =====================================================
     開啟報名視窗
  ===================================================== */

  function openModal(session) {

    selectedSession =
      session;


    document.getElementById("modalDate").textContent =
      shortDate(session.date);


    document.getElementById("modalSession").textContent =
      "第 " + session.sessionId + " 梯";


    document.getElementById("modalTime").textContent =
      session.startTime +
      " – " +
      session.endTime;


    document.getElementById("modalRemaining").textContent =
      session.remaining +
      " 人";


    document.getElementById("nameInput").value = "";

    document.getElementById("phoneInput").value = "";

    document.getElementById("resultArea").innerHTML = "";


    document.getElementById("confirmBtn").disabled =
      false;

    document.getElementById("confirmBtn").textContent =
      "確認報名";


    document.getElementById("cancelBtn").disabled =
      false;


    document.getElementById("modalBg").style.display =
      "flex";


    setTimeout(function() {

      document.getElementById("nameInput").focus();

    }, 100);

  }


  /* =====================================================
     關閉視窗
  ===================================================== */

  function closeModal() {

    if (bookingTimer) {

      clearInterval(bookingTimer);

      bookingTimer = null;

    }


    document.getElementById("modalBg").style.display =
      "none";


    selectedSession = null;

  }


  /* =====================================================
     執行報名
  ===================================================== */

  function submitBooking() {

    if (!selectedSession) {

      return;

    }


    const name =
      document.getElementById("nameInput")
        .value
        .trim();


    const phone =
      document.getElementById("phoneInput")
        .value
        .trim();


    if (!name) {

      alert("請輸入姓名");

      return;

    }


    if (!/^09\d{8}$/.test(phone)) {

      alert("請輸入正確的手機號碼，例如 0912345678");

      return;

    }


    if (!currentIDToken) {

      alert("LINE 身分驗證失效，請重新整理頁面。");

      return;

    }


    /*
     * 產生唯一 request ID
     */

    bookingRequestId =
      "REQ_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 10);


    /*
     * 鎖定按鈕
     */

    document.getElementById("confirmBtn").disabled =
      true;

    document.getElementById("cancelBtn").disabled =
      true;

    document.getElementById("confirmBtn").textContent =
      "報名處理中...";


    document.getElementById("resultArea").innerHTML =
      "";


    /*
     * 建立隱藏表單
     */

    const form =
      document.createElement("form");


    form.method =
      "POST";


    form.action =
      API_URL;


    form.target =
      "bookingFrame";


    form.style.display =
      "none";


    addFormField(
      form,
      "request_id",
      bookingRequestId
    );


    addFormField(
      form,
      "date",
      selectedSession.date
    );


    addFormField(
      form,
      "session_id",
      selectedSession.sessionId
    );


    addFormField(
      form,
      "name",
      name
    );


    addFormField(
      form,
      "phone",
      phone
    );


    /*
     * 最重要：
     * ID Token 放在 POST Body
     * 不放在網址
     */

    addFormField(
      form,
      "id_token",
      currentIDToken
    );


    document.body.appendChild(form);


    /*
     * 送出
     */

    form.submit();


    /*
     * 移除表單
     */

    setTimeout(function() {

      if (form.parentNode) {

        form.remove();

      }

    }, 1000);


    /*
     * 開始查詢報名結果
     */

    startBookingPolling();

  }


  /* =====================================================
     建立 POST 欄位
  ===================================================== */

  function addFormField(form, name, value) {

    const input =
      document.createElement("input");

    input.type =
      "hidden";

    input.name =
      name;

    input.value =
      value;


    form.appendChild(input);

  }


  /* =====================================================
     輪詢報名結果
  ===================================================== */

  function startBookingPolling() {

    let elapsed = 0;

    const interval = 1000;

    const timeout = 30000;


    bookingTimer =
      setInterval(function() {

        elapsed += interval;


        checkBookingStatus();


        if (elapsed >= timeout) {

          clearInterval(bookingTimer);

          bookingTimer = null;


          document.getElementById("confirmBtn").disabled =
            false;

          document.getElementById("cancelBtn").disabled =
            false;

          document.getElementById("confirmBtn").textContent =
            "確認報名";


          document.getElementById("resultArea").innerHTML =
            '<div class="fail-box">' +
            '報名處理時間較久，請稍候再重新整理場次。' +
            '</div>';

        }

      }, interval);

  }


  /* =====================================================
     查詢報名狀態
  ===================================================== */

  function checkBookingStatus() {

    if (!bookingRequestId) {

      return;

    }


    const callbackName =
      "bookingCallback_" +
      Date.now() +
      "_" +
      (++jsonpCounter);


    window[callbackName] = function(data) {

      try {

        delete window[callbackName];


        const script =
          document.getElementById(callbackName);

        if (script) {

          script.remove();

        }


        if (!data) {

          return;

        }


        if (
          data.status === "processing"
        ) {

          return;

        }


        if (
          data.success === true
        ) {

          clearInterval(bookingTimer);

          bookingTimer = null;


          showBookingSuccess(data);

          return;

        }


        if (
          data.success === false
        ) {

          clearInterval(bookingTimer);

          bookingTimer = null;


          showBookingFailure(
            data.message ||
            "報名失敗"
          );

        }

      }

      catch (error) {

        console.error(error);

      }

    };


    const script =
      document.createElement("script");


    script.id =
      callbackName;


    script.src =
      API_URL +
      "?action=bookingStatus" +
      "&request_id=" +
      encodeURIComponent(bookingRequestId) +
      "&callback=" +
      encodeURIComponent(callbackName) +
      "&_=" +
      Date.now();


    script.onerror = function() {

      delete window[callbackName];

      script.remove();

    };


    document.body.appendChild(script);


    /*
     * 8 秒後清理本次 JSONP
     */

    setTimeout(function() {

      if (window[callbackName]) {

        delete window[callbackName];

        if (script.parentNode) {

          script.remove();

        }

      }

    }, 8000);

  }


  /* =====================================================
     報名成功
  ===================================================== */

  function showBookingSuccess(data) {

    document.getElementById("confirmBtn").textContent =
      "報名成功";


    document.getElementById("resultArea").innerHTML =
      '<div class="success-box">' +
      '<strong>🎉 報名成功！</strong><br><br>' +

      '日期：' +
      shortDate(selectedSession.date) +
      '<br>' +

      '第 ' +
      selectedSession.sessionId +
      ' 梯<br>' +

      '時間：' +
      selectedSession.startTime +
      ' – ' +
      selectedSession.endTime +
      '<br><br>' +

      '請準時到場。' +

      '</div>';


    /*
     * 重新載入場次
     */

    setTimeout(function() {

      closeModal();

      loadSessions();

    }, 1500);

  }


  /* =====================================================
     報名失敗
  ===================================================== */

  function showBookingFailure(message) {

    document.getElementById("confirmBtn").disabled =
      false;

    document.getElementById("cancelBtn").disabled =
      false;

    document.getElementById("confirmBtn").textContent =
      "確認報名";


    document.getElementById("resultArea").innerHTML =
      '<div class="fail-box">' +
      '❌ ' +
      escapeHtml(message) +
      '</div>';

  }


  /* =====================================================
     顯示錯誤
  ===================================================== */

  function showError(message) {

    document.getElementById("errorArea").innerHTML =
      '<div class="error-box">' +
      escapeHtml(message) +
      '</div>';

  }


  /* =====================================================
     日期簡化
  ===================================================== */

  function shortDate(dateString) {

    const parts =
      dateString.split("-");


    if (parts.length !== 3) {

      return dateString;

    }


    return (
      parts[1] +
      "/" +
      parts[2]
    );

  }


  /* =====================================================
     HTML Escape
  ===================================================== */

  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>
