<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>樂羽會館｜LIFF測試</title>

  <script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      background: #f5f7fa;

      color: #222;

    }

    .box {

      max-width: 500px;

      margin: 40px auto;

      background: white;

      padding: 28px;

      border-radius: 18px;

      box-shadow:
        0 4px 16px
        rgba(0,0,0,0.08);

      text-align: center;

    }

    h1 {

      font-size: 24px;

      margin-bottom: 10px;

    }

    .status {

      margin-top: 20px;

      padding: 16px;

      border-radius: 12px;

      background: #f3f4f6;

      line-height: 1.7;

    }

    .success {

      background: #dcfce7;

      color: #166534;

    }

    .error {

      background: #fee2e2;

      color: #991b1b;

    }

    .name {

      margin-top: 20px;

      font-size: 20px;

      font-weight: 700;

    }

  </style>

</head>


<body>

  <div class="box">

    <h1>
      樂羽會館
    </h1>

    <div>
      LIFF 系統測試
    </div>

    <div
      id="status"
      class="status"
    >
      正在初始化 LINE...
    </div>

    <div
      id="name"
      class="name"
    ></div>

  </div>


  <script>

    // ========================================
    // LIFF ID
    // ========================================

    const LIFF_ID =
      "2011603755-U8yYBa4n";


    // ========================================
    // 初始化
    // ========================================

    async function initLIFF() {

      const status =
        document.getElementById(
          "status"
        );

      const name =
        document.getElementById(
          "name"
        );


      try {

        // --------------------------------------
        // 初始化 LIFF
        // --------------------------------------

        await liff.init({

          liffId:
            LIFF_ID,

          withLoginOnExternalBrowser:
            true

        });


        // --------------------------------------
        // 尚未登入
        // --------------------------------------

        if (!liff.isLoggedIn()) {

          status.innerText =
            "正在進行 LINE 登入...";

          liff.login();

          return;

        }


        // --------------------------------------
        // 取得使用者資料
        // --------------------------------------

        const profile =
          await liff.getProfile();


        // --------------------------------------
        // 顯示成功
        // --------------------------------------

        status.className =
          "status success";

        status.innerText =
          "✓ LINE LIFF 初始化成功";


        name.innerText =
          "歡迎，" +
          profile.displayName;


        console.log(
          "LINE User ID：",
          profile.userId
        );


        // --------------------------------------
        // 取得 ID Token
        // --------------------------------------

        const idToken =
          liff.getIDToken();


        console.log(
          "ID Token 已取得：",
          !!idToken
        );


      }

      catch (error) {

        console.error(
          "LIFF 錯誤：",
          error
        );


        status.className =
          "status error";


        status.innerText =
          "✕ LINE LIFF 初始化失敗\n\n" +
          (
            error &&
            error.message
              ? error.message
              : "未知錯誤"
          );

      }

    }


    // ========================================
    // 啟動
    // ========================================

    window.addEventListener(
      "load",
      initLIFF
    );

  </script>

</body>

</html>
